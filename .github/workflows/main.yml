name: Build

on:
  pull_request:
    branches: [main]      # runs when a PR targets the default branch
  push:
    branches: [main]      # runs when a commit lands on the default branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
